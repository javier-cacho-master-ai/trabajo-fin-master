[project]
name = "astronomical-signal-improvement"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Carla Sequero" },
    { name = "J. Javier Cacho" },
]
dependencies = [
    "astropy>=7.2.0",
    "astroquery>=0.4.11",
    "gaiaxpy>=2.1.4",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
    "matplotlib>=3.10.8",
    "pandas>=3.0.2",
    "plotly-express>=0.4.1",
    "specutils>=2.3.0",
    "h5py>=3.12.1",
    "tensorflow>=2.20.0",
    "lockfile>=0.12.2",
    "dill>=0.4.1",
    "statsmodels>=0.14.6",
    "numpy>=2.4.4",
    "pydot>=4.0.1",
    "visualkeras>=0.2.0",
]

# La versión publicada en PyPI (0.2.0) solo trae las vistas `layered` y `graph`;
# las vistas `functional` y `lenet` están únicamente en el repositorio
[tool.uv.sources]
visualkeras = { git = "https://github.com/paulgavrikov/visualkeras", rev = "b5234255cf8f85315da27d6c58a8adaff6f78da8" }
