# Fuente única de acrónimos. La lee la plantilla Typst (`_partials/acronyms.typ`)
# para generar tanto el "Índice de acrónimos" como las menciones en el texto
# (primera mención encabezada por el término en español, siguientes solo la sigla).
#
# Campos por acrónimo:
#   key          Identificador para referenciar en el texto con [KEY]{.acr}.
#   shortname    Sigla mostrada.
#   longname     Desarrollo en su idioma original, en texto plano.
#   translation  Traducción al español, en minúscula salvo nombres propios
#                (opcional). Encabeza la primera mención en el texto,
#                «translation (SIGLA; longname)», y cierra la línea del índice,
#                «SIGLA: longname (translation)».
#   italic       Si el desarrollo va en cursiva en el índice (true por defecto;
#                false para términos ya en español, como IA o XP).
acronyms:
  - key: ADQL
    shortname: ADQL
    longname: Astronomical Data Query Language
    translation: lenguaje de consulta de datos astronómicos
  - key: BP/RP
    shortname: BP/RP
    longname: Blue Photometer / Red Photometer
    translation: fotómetro azul / fotómetro rojo
  - key: CNN
    shortname: CNN
    longname: Convolutional neural network
    translation: red neuronal convolucional
  - key: DR
    shortname: DR
    longname: Data Release
    translation: liberación de datos
  - key: ELBO
    shortname: ELBO
    longname: Evidence Lower Bound
    translation: cota inferior de la evidencia
  - key: ESA
    shortname: ESA
    longname: European Space Agency
    translation: Agencia Espacial Europea
  - key: FITS
    shortname: FITS
    longname: Flexible Image Transport System
    translation: sistema flexible de transporte de imágenes
  - key: GAN
    shortname: GAN
    longname: Generative Adversarial Network
    translation: red generativa antagónica
  - key: GRU
    shortname: GRU
    longname: Gated Recurrent Unit
    translation: unidad recurrente con puertas
  - key: HR
    shortname: HR
    longname: Hertzsprung-Russell
    translation: diagrama de Hertzsprung-Russell
  - key: IA
    shortname: IA
    longname: Inteligencia Artificial
    italic: false
  - key: JADES
    shortname: JADES
    longname: JWST Advanced Deep Extragalactic Survey
